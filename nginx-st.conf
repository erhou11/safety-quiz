# st.952121.xyz - 安全生产技术刷题 App
server {
    listen 80;
    server_name st.952121.xyz;
    root /opt/quizapp/www;
    index index.html;
    charset utf-8;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(png|css|js|ico)$ { expires 7d; add_header Cache-Control "public"; }
}

server {
    listen 443 ssl http2;
    server_name st.952121.xyz;
    ssl_certificate /etc/nginx/ssl/952121.crt;
    ssl_certificate_key /etc/nginx/ssl/952121.key;
    root /opt/quizapp/www;
    index index.html;
    charset utf-8;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(png|css|js|ico)$ { expires 7d; add_header Cache-Control "public"; }
}
